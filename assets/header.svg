<svg xmlns="http://www.w3.org/2000/svg" width="835" height="210" viewBox="0 0 835 210" role="img" aria-label="Amal Zakaria — Web Developer, Designer, Video Editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cf5ff"/>
      <stop offset="50%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#ff7cf5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cf5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c8cff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff7cf5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7cf5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7cf5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7cf5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff7cf5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#30363d" fill-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="835" height="210" rx="18" fill="url(#bg)"/>
  <rect width="835" height="210" rx="18" fill="url(#grid)"/>
  <circle cx="120" cy="40" r="110" fill="url(#glow1)"/>
  <circle cx="730" cy="180" r="120" fill="url(#glow2)"/>
  <rect x="1" y="1" width="833" height="208" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#7cf5ff" font-size="26" font-weight="700" opacity="0.85">
    <text x="58" y="78">&lt;/&gt;</text>
    <text x="738" y="78">{ }</text>
  </g>

  <text x="417" y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#name)">Amal Zakaria</text>
  <text x="417" y="146" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" letter-spacing="3" fill="#8b949e">WEB DEVELOPER &#183; DESIGNER &#183; VIDEO EDITOR</text>
  <rect x="217" y="168" width="400" height="3" rx="1.5" fill="url(#line)"/>
</svg>
